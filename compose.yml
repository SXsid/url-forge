services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - APP_ENV=dev
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:latest
    container_name: my_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sid
      - POSTGRES_PASSWORD=sid
      - POSTGRES_DB=url
    ports:
      - 5432:5432
    volumes:
      - "./database:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sid -d url"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - ./redis:/data
    command: >
      redis-server
      --requirepass sid
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sid", "ping"]
      retries: 5
      interval: 10s
      timeout: 5s
